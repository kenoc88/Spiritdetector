name: Build SpiritDetector APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SpiritDetector-Android-GitHub.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip SpiritDetector-Android-GitHub.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/spiritdetector
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiritDetector-APK
          path: source/spiritdetector/app/build/outputs/apk/debug/app-debug.apk
